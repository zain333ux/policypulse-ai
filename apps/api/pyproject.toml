[project]
name = "policypulse-api"
version = "0.1.0"
description = "Evidence-first policy consultation API for PolicyPulse AI"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "pydantic>=2.9,<3",
  "pydantic-settings>=2.5,<3",
  "python-multipart>=0.0.12,<1",
  "groq>=0.18,<2",
  "openai>=2.0,<3",
  "httpx>=0.27,<1",
  "PyMuPDF>=1.24,<2",
  "python-docx>=1.1,<2",
  "pandas>=2.2,<4",
  "openpyxl>=3.1,<4",
  "xlrd>=2.0,<3",
  "charset-normalizer>=3.4,<4",
  "reportlab>=4.2,<5",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.24,<1",
  "ruff>=0.8,<1",
  "mypy>=1.13,<2",
  "langgraph>=1.2.6,<2",
]
langgraph = [
  "langgraph>=1.2.6,<2",
]
experiments = [
  "crewai>=1.14.7,<2",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
ignore_missing_imports = true
strict = true
disable_error_code = ["import-untyped"]
